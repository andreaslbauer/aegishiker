name: aegishiker
base: core24
icon: src/assets/appicon.svg
adopt-info: aegishiker

compression: xz
title: AegisHiker
contact: mailto:maintainer@example.com
license: Proprietary
issues: https://example.com/support
website: https://example.com
summary: Offline-first hike planner, route composer, photo matcher & mobile companion
description: |
  AegisHiker plans, records and relives hikes, entirely offline. Explore bundled
  region packs (White Mountains, Pioneer Valley, Great Smoky Mountains, Grand Canyon,
  Yellowstone, Grand Teton, Joshua Tree and more) with topographic maps and every
  named trail, compose routes trail by trail with elevation and timing, brainstorm
  hikes with a local AI (Ollama), sync a phone companion over your own Wi-Fi, and
  re-experience past hikes on the map and in 3D with your geotagged photos.

grade: stable
confinement: strict

apps:
  aegishiker:
    command: bin/aegishiker-launcher
    extensions: [gnome]
    plugs:
      - home
      - network
      - network-bind  # LAN server for the phone companion
      - opengl
      - removable-media
      - desktop
      - desktop-legacy
      - x11
      - wayland
      - gsettings
      - audio-playback

parts:
  aegishiker:
    plugin: python
    source: .
    python-requirements:
      - requirements.txt
    stage-packages:
      # Python interpreter (core24 has none) and what Qt's xcb/wayland platform plugins load
      - python3.12-minimal
      - libpython3.12-minimal
      - libpython3.12-stdlib
      - python3-venv
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libxkbcommon-x11-0
      - libegl1
      - libopengl0
      - libgl1
    override-build: |
      craftctl default
      craftctl set version="$(tr -d '[:space:]' < version.txt)"
      # The application itself, next to the Python environment the plugin built
      mkdir -p "$CRAFT_PART_INSTALL/app"
      cp -r main.py src data config version.txt LICENSES.html "$CRAFT_PART_INSTALL/app/"
      find "$CRAFT_PART_INSTALL/app" -type d -name "__pycache__" -exec rm -rf {} +
      install -Dm755 snap/local/launcher.sh "$CRAFT_PART_INSTALL/bin/aegishiker-launcher"
      # The venv's pyvenv.cfg points at the build machine's SDK interpreter, which an installed snap
      # can't see; the launcher sets PYTHONHOME/PYTHONPATH to the bundled interpreter instead
      rm -f "$CRAFT_PART_INSTALL/pyvenv.cfg"
